<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Level Up: Personal Life OS — Real-Life Character Progression System" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>Level Up: Personal Life OS | Real-Life RPG</title>
  </head>
  <body class="bg-[#030712] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">
    <noscript>
      <div style="padding: 24px; text-align: center; color: #f87171; background: #0f172a; font-family: sans-serif;">
        <h2>JavaScript Required</h2>
        <p>Level Up: Personal Life OS requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div id="root">
      <!-- Instant pre-React loading screen -->
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030712; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <div style="width: 52px; height: 52px; border: 3px solid rgba(6,182,212,0.2); border-top-color: #06b6d4; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
        <div style="font-weight: 900; letter-spacing: 0.1em; color: #ffffff; font-size: 16px; margin-bottom: 6px;">LEVEL UP: LIFE OS</div>
        <div style="font-size: 12px; color: #06b6d4; font-weight: 600;">Initializing Character Engine...</div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
