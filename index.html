<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Level Up: Personal Life OS — Real-Life Character Progression System" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Level Up: Personal Life OS | Real-Life RPG</title>
  </head>
  <body class="bg-[#030712] text-slate-100 antialiased selection:bg-cyan-500 selection:text-slate-950">
    <noscript>
      <div style="padding: 24px; text-align: center; color: #f87171; background: #0f172a; font-family: sans-serif;">
        <h2>JavaScript Required</h2>
        <p>Level Up: Personal Life OS requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <div id="root">
      <!-- Instant pre-React loading screen -->
      <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #030712; color: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <div style="position: relative; width: 72px; height: 72px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; inset: -8px; border-radius: 20px; background: radial-gradient(circle, rgba(6,182,212,0.25) 0%, rgba(3,7,18,0) 70%); filter: blur(6px); animation: pulseGlow 2s ease-in-out infinite alternate;"></div>
          <img src="/logo.png" alt="Level Up Infinity" style="width: 64px; height: 64px; object-fit: contain; filter: drop-shadow(0 0 10px rgba(255,255,255,0.45)); animation: pulseLogo 2s ease-in-out infinite alternate;" />
        </div>
        <div style="font-weight: 900; letter-spacing: 0.15em; color: #ffffff; font-size: 17px; margin-bottom: 6px;">LEVEL UP: LIFE OS</div>
        <div style="font-size: 11px; color: #06b6d4; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;">Initializing Character Engine...</div>
        <style>
          @keyframes pulseLogo { 0% { transform: scale(0.96); opacity: 0.85; } 100% { transform: scale(1.04); opacity: 1; } }
          @keyframes pulseGlow { 0% { opacity: 0.4; } 100% { opacity: 0.9; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update().catch(() => {});
          }).catch(() => {});
        });
      }
    </script>
  </body>
</html>
